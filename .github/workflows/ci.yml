name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # `npm install` rather than `npm ci` so the first push works before a
      # lockfile is committed. Switch to `npm ci` once package-lock.json exists.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_URL: https://example.com

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      # Plain clone rather than `forge install`, which wants to manage a git
      # submodule inside the parent repo. remappings.txt points at lib/forge-std.
      - name: Install forge-std
        working-directory: contracts
        run: git clone --depth 1 https://github.com/foundry-rs/forge-std lib/forge-std
      - name: Build
        working-directory: contracts
        run: forge build --sizes
      - name: Test
        working-directory: contracts
        run: forge test -vvv
